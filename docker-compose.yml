version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobagent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobagent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_dev_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-jobagent_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobagent_user} -d ${POSTGRES_DB:-jobagent_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobagent_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: jobagent_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=development
      - EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobagent_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobagent_user}:${POSTGRES_PASSWORD:-secure_dev_password_2026}@postgres:5432/${POSTGRES_DB:-jobagent_db}
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:-SuperSecretKeyForDevelopmentPurposesMustBeAtLeast32BytesLong2026!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started

  crawler-service:
    build:
      context: ./crawler-service
      dockerfile: Dockerfile
    container_name: jobagent_crawler
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - BACKEND_API_URL=http://backend:5000/api/v1
      - INGESTION_INTERVAL_MINUTES=60
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobagent_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
      - NODE_ENV=development
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

