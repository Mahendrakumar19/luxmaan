[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf --daemonize no
user=redis
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ai-service]
command=/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app/ai-service
environment=PORT="8000",ENVIRONMENT="production",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=node dist/index.js
directory=/app/backend
environment=PORT="5000",NODE_ENV="production",DATABASE_URL="postgresql://jobagent_user:secure_dev_password_2026@127.0.0.1:5432/jobagent_db",REDIS_URL="redis://127.0.0.1:6379",AI_SERVICE_URL="http://127.0.0.1:8000",JWT_SECRET="SuperSecretKeyForDevelopmentPurposesMustBeAtLeast32BytesLong2026!"
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:crawler]
command=/opt/venv/bin/python worker.py
directory=/app/crawler-service
environment=BACKEND_API_URL="http://127.0.0.1:5000/api/v1",DAEMON_MODE="true",INGESTION_INTERVAL_MINUTES="60",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=npm start
directory=/app/frontend
environment=PORT="3000",HOSTNAME="0.0.0.0",NEXT_PUBLIC_API_URL="/api/v1",BACKEND_INTERNAL_URL="http://127.0.0.1:5000"
autostart=true
autorestart=true
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
