version: '3.8'

services:
  nilam-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nilam_all_in_one
    restart: unless-stopped
    ports:
      # Unified Nginx Gateway (Frontend + APIs under one port)
      - "80:80"
      # Direct microservice ports (for backward compatibility and direct testing)
      - "3000:3000"   # Next.js Candidate & Admin Frontend
      - "5000:5000"   # Node.js TypeScript REST API
      - "8000:8000"   # Python FastAPI AI Microservice
      - "5432:5432"   # PostgreSQL 16 + pgvector
      - "6379:6379"   # Redis 7 Cache
    volumes:
      - nilam_pgdata:/var/lib/postgresql
      - nilam_redisdata:/var/lib/redis
    environment:
      - NODE_ENV=production
      - ENVIRONMENT=production
      - JWT_SECRET=SuperSecretKeyForDevelopmentPurposesMustBeAtLeast32BytesLong2026!
      - INGESTION_INTERVAL_MINUTES=60

volumes:
  nilam_pgdata:
  nilam_redisdata:
