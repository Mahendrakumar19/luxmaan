version: '3.8'

services:
  luxmaan-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: luxmaan-jobagent:latest
    container_name: luxmaan_all_in_one
    restart: always
    ports:
      - "127.0.0.1:3010:3000"
      - "127.0.0.1:5010:5000"
      - "127.0.0.1:8010:8000"
      - "127.0.0.1:5433:5432"
      - "127.0.0.1:6380:6379"
    volumes:
      - luxmaan_pgdata:/var/lib/postgresql
      - luxmaan_redisdata:/var/lib/redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.luxmaan.entrypoints=web,websecure"
      - "traefik.http.routers.luxmaan.rule=Host(`luxmaan.aiwcrm.in`)"
      - "traefik.http.routers.luxmaan.tls=true"
      - "traefik.http.services.luxmaan.loadbalancer.server.port=80"
    environment:
      - NODE_ENV=production
      - ENVIRONMENT=production
      - JWT_SECRET=SuperSecretKeyForDevelopmentPurposesMustBeAtLeast32BytesLong2026!
      - INGESTION_INTERVAL_MINUTES=60

volumes:
  luxmaan_pgdata:
  luxmaan_redisdata:
